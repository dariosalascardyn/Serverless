name: Deploy Serverless con LabRole

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout código
        uses: actions/checkout@v4

      - name: 2. Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: 3. Compilar JAR con Maven
        run: mvn clean package -DskipTests

      - name: 4. Instalar Serverless Framework
        run: npm install -g serverless@3

      - name: 5. Desplegar en AWS Academy
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          MENSAJE_REMOTO: ${{ vars.MENSAJE_REMOTO }}
        run: serverless deploy